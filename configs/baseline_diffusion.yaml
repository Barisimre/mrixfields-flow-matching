# Paper baseline B — SDEdit / x0-init diffusion, SAME U-Net as the flow model.
# Trained by `src/baselines/train_baseline.py`; nothing in the flow pipeline reads
# this file.
task_name: baseline_sdedit_15h
method: diffusion
network: network.yaml          # identical architecture to the flow model
data:
  multi_contrast: true
  all_pairs: true
  slice_axis: 2

diffusion:
  schedule: cosine             # cosine | linear
  t_start: 0.6                 # how far the source is noised before denoising back
  sample_steps: 50             # DDIM steps from t_start down to 0
  eta: 0.0                     # 0 = deterministic DDIM
  finetune_mode: paired        # paired = denoise the noised SOURCE toward the TARGET
                               # prior  = plain DDPM on targets (literal SDEdit)
  t_min: 0.1                   # floor on the training t in `paired` mode: eps* is
                               # divided by sqrt(1-abar(t)), which blows up as t -> 0

pretrain:
  split: retro_train
  batch_size: 8
  num_workers: 16
  lr: 2.0e-4
  ema_decay: 0.999
  max_hours: 15                # wall-clock budget for THIS stage; 0/absent = unlimited
  epochs: 1000                 # hard cap, effectively unreachable under the budget
  budget_check_every: 200
  save_every: 1
  flip_prob: 0.5
  grad_clip: 0.0
  # No `corruption:` block here — the diffusion pretrain is DDPM noising of the
  # targets, not the degradation menu.

finetune:
  split: pro_train
  batch_size: 8
  num_workers: 16
  lr: 3.0e-5
  ema_decay: 0.999
  max_hours: 15
  epochs: 1000
  budget_check_every: 200
  save_every: 1
  flip_prob: 0.5
  channel_dropout: 0.0
  grad_clip: 0.0

runtime:
  amp: true
  tf32: true
  cudnn_benchmark: true
  compile: false
  persistent_workers: true
  prefetch_factor: 4
